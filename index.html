
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: black;
        color: #00ff41;
        height: 100vh;
        overflow: auto;
        padding: 12px;
        box-sizing: border-box;
        font-family: 'VT323', monospace;
        font-size: 25px;
        line-height: 1.1;
    }

    .flash {
        animation: flash 0.5s ease-out;
    }

    @keyframes flash {
        0% { opacity: 0; }
        15% { opacity: 1; }
        30% { opacity: 0.2; }
        50% { opacity: 1; }
        65% { opacity: 0.4; }
        100% { opacity: 1; }
    }

    #boot, #access, #editor, #result {
        display: none;
    }

    #access {
        margin-top: 1.1em;
    }

    #result {
        margin-top: 0.5em;
    }

    .input-line {
        display: flex;
        align-items: baseline;
        white-space: pre;
    }

    .prefix, .suffix {
        flex-shrink: 0;
    }

    .editable {
        outline: none;
        white-space: pre-wrap;
        min-width: 2px;
        overflow-wrap: anywhere;
    }

    ::selection {
        background: #00ff41;
        color: black;
    }
</style>
</head>

<body>

<div id="title" class="flash">FILE DATABASE V.1.0</div>

<div id="boot">
    BOOTING, PLEASE WAIT<span id="dots">.</span>
</div>

<div id="access">
    PLEASE INPUT ACCESS CODE
</div>

<div id="editor">
    <div class="input-line">
        <span class="prefix">-input "</span><span class="editable" contenteditable="true" spellcheck="false"></span><span class="suffix">"</span>
    </div>
</div>

<div id="result"></div>

<script>
const boot = document.getElementById("boot");
const dots = document.getElementById("dots");
const access = document.getElementById("access");
const editor = document.getElementById("editor");
const result = document.getElementById("result");

let dotCount = 1;
const correctCode = "68213";

// Show boot message after 3 seconds
setTimeout(() => {
    boot.style.display = "block";
    boot.classList.add("flash");
}, 3000);

// Animate dots
const dotAnimation = setInterval(() => {
    dotCount = dotCount % 3 + 1;
    dots.textContent = ".".repeat(dotCount);
}, 500);

// Show access prompt after 8 seconds
setTimeout(() => {
    clearInterval(dotAnimation);
    dots.textContent = "...";

    access.style.display = "block";
    access.classList.add("flash");

    editor.style.display = "block";
    editor.classList.add("flash");

    editor.querySelector(".editable").focus();
}, 8000);

// Check access code
editor.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();

        const input = editor.querySelector(".editable");
        const enteredCode = input.textContent.trim();

        // Remove previous input
        input.textContent = "";

        // Display result
        result.style.display = "block";
        result.classList.remove("flash");

        void result.offsetWidth;

        if (enteredCode === correctCode) {
            result.textContent = "CORRECT";
        } else {
            result.textContent = "INCORRECT";
        }

        result.classList.add("flash");

        // Refocus input
        input.focus();
    }
});
</script>

</body>
</html>
