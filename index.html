

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    background: black;
    height: 100vh;
}
textarea {
    width: 100%;
    height: 100vh;
    padding: 12px;
    box-sizing: border-box;
    background: black;
    color: #00ff41;
    border: none;
    outline: none;
    resize: none;
    font-family: 'VT323', monospace;
    font-size: 25px;
    line-height: 1.1;
    caret-color: #00ff41;
}
</style>
</head>
<body>

<textarea id="terminal" spellcheck="false"></textarea>

<script>
const terminal = document.getElementById("terminal");
const prefix = '-input "';
const lines = [""];

function render(lineIndex = lines.length - 1, cursor = lines[lineIndex].length) {
    terminal.value = lines.map(line => prefix + line + '"').join("\n");

    let pos = 0;
    for (let i = 0; i < lineIndex; i++) {
        pos += prefix.length + lines[i].length + 2;
    }
    pos += prefix.length + cursor;

    terminal.setSelectionRange(pos, pos);
}

function getPosition(pos) {
    let offset = 0;

    for (let i = 0; i < lines.length; i++) {
        const start = offset + prefix.length;
        const end = start + lines[i].length;

        if (pos >= start && pos <= end + 1) {
            return {
                line: i,
                cursor: Math.min(lines[i].length, Math.max(0, pos - start))
            };
        }

        offset += prefix.length + lines[i].length + 2;
    }

    return {
        line: lines.length - 1,
        cursor: lines[lines.length - 1].length
    };
}

terminal.addEventListener("beforeinput", e => {
    const start = getPosition(terminal.selectionStart);
    const end = getPosition(terminal.selectionEnd);

    e.preventDefault();

    if (e.inputType === "insertText" || e.inputType === "insertFromPaste") {
        const text = e.data || "";
        const parts = text.split("\n");

        const before = lines[start.line].slice(0, start.cursor);
        const after = lines[end.line].slice(end.cursor);

        if (parts.length === 1) {
            lines[start.line] = before + text + after;
            render(start.line, start.cursor + text.length);
        } else {
            lines.splice(
                start.line,
                end.line - start.line + 1,
                before + parts[0],
                ...parts.slice(1, -1),
                parts[parts.length - 1] + after
            );
            render(start.line + parts.length - 1, parts[parts.length - 1].length);
        }
    }

    else if (e.inputType === "insertLineBreak") {
        const before = lines[start.line].slice(0, start.cursor);
        const after = lines[end.line].slice(end.cursor);

        lines.splice(start.line, end.line - start.line + 1,
            before, after);

        render(start.line + 1, 0);
    }

    else if (e.inputType === "deleteContentBackward") {
        if (start.line === end.line && start.cursor === end.cursor) {
            if (start.cursor > 0) {
                lines[start.line] =
                    lines[start.line].slice(0, start.cursor - 1) +
                    lines[start.line].slice(start.cursor);
                render(start.line, start.cursor - 1);
            } else if (start.line > 0) {
                const cursor = lines[start.line - 1].length;
                lines[start.line - 1] += lines[start.line];
                lines.splice(start.line, 1);
                render(start.line - 1, cursor);
            }
        } else {
            const before = lines[start.line].slice(0, start.cursor);
            const after = lines[end.line].slice(end.cursor);
            lines.splice(start.line, end.line - start.line + 1, before + after);
            render(start.line, start.cursor);
        }
    }

    else if (e.inputType === "deleteContentForward") {
        if (start.line === end.line && start.cursor === end.cursor) {
            if (start.cursor < lines[start.line].length) {
                lines[start.line] =
                    lines[start.line].slice(0, start.cursor) +
                    lines[start.line].slice(start.cursor + 1);
            } else if (start.line < lines.length - 1) {
                lines[start.line] += lines[start.line + 1];
                lines.splice(start.line + 1, 1);
            }
        } else {
            const before = lines[start.line].slice(0, start.cursor);
            const after = lines[end.line].slice(end.cursor);
            lines.splice(start.line, end.line - start.line + 1, before + after);
        }
        render(start.line, start.cursor);
    }
});

terminal.addEventListener("click", () => {
    const p = getPosition(terminal.selectionStart);
    render(p.line, p.cursor);
});

terminal.addEventListener("keydown", e => {
    if (e.key === "Home") {
        e.preventDefault();
        const p = getPosition(terminal.selectionStart);
        render(p.line, 0);
    }
    if (e.key === "End") {
        e.preventDefault();
        const p = getPosition(terminal.selectionStart);
        render(p.line);
    }
});

render();
terminal.focus();
</script>
</body>
</html>
