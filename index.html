
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: #000;
        height: 100vh;
        overflow: hidden;
    }

    textarea {
        width: 100%;
        height: 100vh;
        padding: 12px;
        box-sizing: border-box;
        background: #000;
        color: #00ff41;
        border: none;
        outline: none;
        resize: none;
        font-family: 'VT323', monospace;
        font-size: 25px;
        line-height: 1.1;
        caret-color: #00ff41;
    }

    ::selection {
        background: #00ff41;
        color: #000;
    }
</style>
</head>

<body>
<textarea id="terminal" spellcheck="false"></textarea>

<script>
const terminal = document.getElementById("terminal");

const prefix = '-input "';
const suffix = '"';

let content = "";

function render(cursor = content.length) {
    terminal.value = prefix + content + suffix;
    terminal.setSelectionRange(
        prefix.length + cursor,
        prefix.length + cursor
    );
}

terminal.addEventListener("beforeinput", (e) => {
    const start = terminal.selectionStart;
    const end = terminal.selectionEnd;

    const contentStart = prefix.length;
    const contentEnd = prefix.length + content.length;

    if (start < contentStart || end > contentEnd) {
        e.preventDefault();
        return;
    }

    if (e.inputType === "insertText") {
        e.preventDefault();
        content = content.slice(0, start - contentStart)
            + e.data
            + content.slice(end - contentStart);

        render(start - contentStart + e.data.length);
    }

    if (e.inputType === "deleteContentBackward") {
        e.preventDefault();

        if (start !== end) {
            content = content.slice(0, start - contentStart)
                + content.slice(end - contentStart);
            render(start - contentStart);
        } else if (start > contentStart) {
            content = content.slice(0, start - contentStart - 1)
                + content.slice(start - contentStart);
            render(start - contentStart - 1);
        }
    }

    if (e.inputType === "deleteContentForward") {
        e.preventDefault();

        if (start !== end) {
            content = content.slice(0, start - contentStart)
                + content.slice(end - contentStart);
        } else {
            content = content.slice(0, start - contentStart)
                + content.slice(start - contentStart + 1);
        }

        render(start - contentStart);
    }
});

terminal.addEventListener("keydown", (e) => {
    const pos = terminal.selectionStart;

    if (e.key === "Home") {
        e.preventDefault();
        render(0);
    }

    if (e.key === "End") {
        e.preventDefault();
        render(content.length);
    }

    if (e.key === "ArrowLeft" && pos <= prefix.length) {
        e.preventDefault();
    }

    if (e.key === "ArrowRight" &&
        pos >= prefix.length + content.length) {
        e.preventDefault();
    }

    if (e.key === "Enter") {
        e.preventDefault();
    }
});

terminal.addEventListener("click", () => {
    const pos = terminal.selectionStart;

    if (pos < prefix.length) {
        render(0);
    } else if (pos > prefix.length + content.length) {
        render(content.length);
    }
});

render();
terminal.focus();
</script>
</body>
</html>
